[package]
name = "ee-pack"
description = "Packs the Enhanced Environment art pack's folder into the one file the Dereth client opens."
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
publish = false

# Its own workspace, apart from anything above it.
[workspace]

# The versions Pyreal's Cargo.lock pins, so the packed bytes are Pyreal's.
[dependencies]
blake3 = { version = "=1.8.7", default-features = false }
glam = "=0.30.10"
png = "=0.17.16"
pxfm = "=0.1.30"
serde_json = "=1.0.151"
sha2 = "=0.10.9"
toml = "=1.1.6"
zstd = { version = "=0.13.5", default-features = false }
